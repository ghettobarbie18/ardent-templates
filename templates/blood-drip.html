<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardent Templates - Blood Drip</title>

<style>
body {
    margin: 0;
    padding: 40px;
    background: #0b0b0b;
    font-family: Georgia, serif;
}

.blood-template {
    position: relative;
    width: 700px;
    min-height: 500px;
    margin: auto;
    padding: 30px;
    box-sizing: border-box;
    background: #170909;
    color: #d8c7c7;
    border: 1px solid #4a1111;
    overflow: hidden;
}

/* Blood-drip top */
.drip {
    position: absolute;
    top: 0;
    background: linear-gradient(to bottom, #a30000, #4d0000);
    border-radius: 0 0 50% 50%;
    box-shadow: 0 3px 8px rgba(0,0,0,0.7);
}

/* Small drips */
.drip.one {
    left: 5%;
    width: 18px;
    height: 42px;
}

.drip.two {
    left: 13%;
    width: 28px;
    height: 70px;
}

.drip.three {
    left: 22%;
    width: 15px;
    height: 35px;
}

.drip.four {
    left: 30%;
    width: 35px;
    height: 90px;
}

/* Middle drips */
.drip.five {
    left: 40%;
    width: 20px;
    height: 55px;
}

.drip.six {
    left: 48%;
    width: 42px;
    height: 105px;
}

.drip.seven {
    left: 59%;
    width: 17px;
    height: 45px;
}

.drip.eight {
    left: 67%;
    width: 32px;
    height: 78px;
}

/* Right side */
.drip.nine {
    left: 76%;
    width: 20px;
    height: 50px;
}

.drip.ten {
    left: 84%;
    width: 45px;
    height: 110px;
}

.drip.eleven {
    left: 94%;
    width: 18px;
    height: 40px;
}

.title {
    position: relative;
    margin-top: 10px;
    color: #c51616;
    font-size: 34px;
    letter-spacing: 5px;
    text-transform: uppercase;
    text-shadow: 2px 2px 5px #000;
}

.quote {
    margin-top: 10px;
    color: #8f7777;
    font-style: italic;
    font-size: 15px;
}

.text {
    width: 60%;
    margin-top: 35px;
    line-height: 1.7;
    font-family: Arial, sans-serif;
    font-size: 13px;
    text-align: justify;
}

.image {
    position: absolute;
    right: 25px;
    top: 145px;
    width: 190px;
    height: 260px;
    background: #240909;
    border: 1px solid #641313;
    background-size: cover;
    background-position: center;
}

.footer-quote {
    position: absolute;
    bottom: 25px;
    left: 30px;
    right: 30px;
    padding-top: 15px;
    border-top: 1px solid #641313;
    color: #a83232;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
}
</style>
</head>

<body>

<div class="blood-template">

    <div class="drip five"></div>
<div class="drip six"></div>
<div class="drip seven"></div>
<div class="drip eight"></div>
<div class="drip nine"></div>
<div class="drip ten"></div>
<div class="drip eleven"></div>

    <div class="title">
        TITLE / NAME
    </div>

    <div class="quote">
        "A dark quote goes here..."
    </div>

    <div class="text">
        This is where your template text goes. You can place
        character information, lyrics, roleplay text, or a
        description here.
    </div>

    <div class="image" style="background-image: url('https://raw.githubusercontent.com/ghettobarbie18/ardent-templates/refs/heads/main/woman.jpg');">
</div>

    <div class="footer-quote">
        Your lyrics or quote here
    </div>

</div>

</body>
</html>
